<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d4bc3"><title>Mộng Thư Các — Thư viện tiểu thuyết</title>
<style>
:root{--bg:#f7f5fc;--panel:#fff;--ink:#28243a;--muted:#777187;--accent:#7654c8;--line:#e9e4f2;--soft:#f0ebfa;--reader:#fffdf8}
[data-theme="dark"]{--bg:#171522;--panel:#211e2e;--ink:#f2effa;--muted:#aaa3bb;--accent:#b49aff;--line:#393347;--soft:#302943;--reader:#211e2e}
[data-theme="paper"]{--bg:#eee5d3;--panel:#f8f1e3;--ink:#493b2b;--muted:#89765f;--accent:#986b39;--line:#dfd0b8;--soft:#eee2ce;--reader:#fbf4e7}
[data-theme="rose"]{--bg:#fff3f6;--panel:#fff;--ink:#4c2938;--muted:#987484;--accent:#c35e87;--line:#f2dce5;--soft:#fbe8ef;--reader:#fffafb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:white;font-weight:650}.ghost{background:var(--soft);color:var(--ink)}.danger{background:#b9475a}.wrap{max-width:1120px;margin:auto;padding:0 18px}.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}.bar{height:68px;display:flex;align-items:center;gap:14px}.brand{font-family:Georgia,serif;font-size:23px;font-weight:bold;color:var(--accent);white-space:nowrap}.search{flex:1;max-width:430px}.search input,.field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}.nav{display:flex;gap:8px;margin-left:auto;align-items:center}.nav button{white-space:nowrap}.hero{margin:26px 0;padding:30px;border-radius:22px;background:linear-gradient(120deg,var(--soft),var(--panel));border:1px solid var(--line)}.hero h1{font: bold clamp(27px,5vw,42px)/1.15 Georgia,serif;margin:0 0 10px}.muted{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-head h2{font: bold 23px Georgia,serif;margin:0}.chips{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.chip{background:var(--soft);color:var(--ink);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}.book{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}.book:hover{transform:translateY(-3px)}.cover{height:190px;display:grid;place-items:center;text-align:center;padding:15px;color:white;font: bold 24px Georgia,serif;background:linear-gradient(145deg,#8e70c9,#42356c)}.book:nth-child(3n) .cover{background:linear-gradient(145deg,#c77c9b,#75445f)}.book:nth-child(3n+1) .cover{background:linear-gradient(145deg,#668d9d,#344b65)}.book-info{padding:12px}.book-info b{display:block;line-height:1.3}.book-info small{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;margin:16px 0}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field-wrap{margin:12px 0}.field-wrap label{display:block;font-weight:650;margin-bottom:5px}.field-wrap textarea{min-height:110px;resize:vertical}.reader{max-width:780px;margin:25px auto;background:var(--reader);padding:clamp(20px,5vw,55px);border:1px solid var(--line);border-radius:18px}.reader-text{font:20px/1.95 Georgia,serif;white-space:pre-wrap}.reader-controls{display:flex;gap:8px;flex-wrap:wrap}.reader-controls select{padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:var(--soft);color:var(--ink)}.tab.active{background:var(--accent);color:white}.notice{padding:12px;border-radius:12px;background:var(--soft);color:var(--muted);margin:12px 0}.modalback{position:fixed;inset:0;background:#0008;z-index:10;display:grid;place-items:center;padding:15px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:18px;padding:22px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 17px;border-radius:12px;z-index:20}.footer{padding:35px 0;color:var(--muted);text-align:center}.small{font-size:13px}.listitem{padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:700px){.bar{height:auto;min-height:62px;flex-wrap:wrap;padding:10px 0}.brand{font-size:20px}.search{order:3;max-width:none;flex-basis:100%}.nav{gap:5px}.nav button{padding:8px;font-size:13px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cover{height:165px}.reader-text{font-size:19px}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><div class="brand" onclick="home()">✦ Mộng Thư Các</div><div class="search"><input id="search" placeholder="Tìm tên truyện, tác giả..." oninput="renderBooks()"></div><div class="nav"><button class="ghost" onclick="home()">Trang chủ</button><button class="ghost" onclick="openShelf()">Tủ sách</button><button onclick="openAccount()" id="accountBtn">Đăng nhập</button></div></div></header>
<main class="wrap">
<section id="homeView">
<div class="hero"><div class="muted">THƯ VIỆN TIỂU THUYẾT TRỰC TUYẾN</div><h1>Mỗi câu chuyện,<br>một thế giới đang chờ.</h1><p class="muted">Khám phá những hành trình mới trong thế giới văn chương.</p><div class="row"><button onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Khám phá truyện</button><button class="ghost" onclick="openAccount()">Khu vực tác giả</button></div></div>
<div class="section-head"><h2>Thể loại</h2></div><div class="chips" id="genres"></div>
<div class="section-head"><h2>Kho truyện</h2><span class="muted small" id="count"></span></div><div class="grid" id="catalog"></div>
</section>
<section id="detailView" class="hidden"></section><section id="readerView" class="hidden"></section><section id="shelfView" class="hidden"></section><section id="dashboardView" class="hidden"></section>
<div class="footer">Mộng Thư Các · Không gian dành cho người yêu tiểu thuyết</div>
</main>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CONFIG={SUPABASE_URL:"",SUPABASE_ANON_KEY:""};
let sb=null,user=null,profile=null,books=[],chapters=[],activeGenre="Tất cả",currentBook=null,currentChapter=null,readerSize=20;
const demo=[
{id:"d1",title:"Dưới Trăng Thanh Vân",author_name:"Mộng tác giả",genre:"Tiên hiệp",description:"Một thiếu nữ bước vào con đường tu hành, khám phá bí mật bị chôn vùi giữa các giới.",status:"Đang ra",cover:"",demo:true},
{id:"d2",title:"Thư Gửi Ngày Hạ",author_name:"An Nhiên",genre:"Ngôn tình",description:"Những lá thư cũ mở ra một câu chuyện trưởng thành và tình bạn.",status:"Hoàn thành",demo:true},
{id:"d3",title:"Vạn Giới Du Ký",author_name:"Bạch Vân",genre:"Huyền huyễn",description:"Một chuyến phiêu lưu qua những vùng đất kỳ ảo và bí ẩn.",status:"Đang ra",demo:true},
{id:"d4",title:"Sau Cánh Cửa Thời Gian",author_name:"Lam Khê",genre:"Xuyên nhanh",description:"Mỗi cánh cửa là một thế giới, mỗi lựa chọn đều có cái giá riêng.",status:"Đang ra",demo:true}
];
let localBooks=JSON.parse(localStorage.getItem("mtc_books")||"null")||demo;
let localChapters=JSON.parse(localStorage.getItem("mtc_chapters")||"{}");
const genres=["Tất cả","Ngôn tình","Tiên hiệp","Huyền huyễn","Xuyên nhanh","Hệ thống","Đô thị","Trinh thám","Phiêu lưu"];
function saveLocal(){localStorage.setItem("mtc_books",JSON.stringify(localBooks));localStorage.setItem("mtc_chapters",JSON.stringify(localChapters))}
function toast(s){let e=document.getElementById("toastRoot");e.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>e.innerHTML="",2400)}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function show(id){["homeView","detailView","readerView","shelfView","dashboardView"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0)}
function home(){show("homeView");renderBooks()}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("mtc_theme",t)}
function init(){setTheme(localStorage.getItem("mtc_theme")||"light");document.getElementById("genres").innerHTML=genres.map(g=>`<button class="chip" onclick="activeGenre='${g}';renderBooks()">${g}</button>`).join("");if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY){sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);sb.auth.getSession().then(({data})=>loadUser(data.session?.user));sb.auth.onAuthStateChange((_e,s)=>loadUser(s?.user))}renderBooks()}
async function loadUser(u){user=u||null;profile=null;if(user&&sb){let {data}=await sb.from("profiles").select("*").eq("id",user.id).single();profile=data}document.getElementById("accountBtn").textContent=user?(profile?.display_name||"Tài khoản"):"Đăng nhập"}
async function fetchBooks(){if(sb){let {data,error}=await sb.from("books").select("*,profiles:author_id(display_name)").eq("published",true).order("created_at",{ascending:false});if(!error){books=(data||[]).map(b=>({...b,author_name:b.profiles?.display_name||"Tác giả"}));return}}books=localBooks}
async function renderBooks(){await fetchBooks();let q=document.getElementById("search").value.toLowerCase();let a=books.filter(b=>(activeGenre==="Tất cả"||b.genre===activeGenre)&&(`${b.title} ${b.author_name} ${b.genre}`).toLowerCase().includes(q));document.getElementById("count").textContent=a.length+" tác phẩm";document.getElementById("catalog").innerHTML=a.length?a.map(b=>`<article class="book" onclick="openBook('${b.id}')"><div class="cover">${b.cover_url?`<img src="${esc(b.cover_url)}" style="width:100%;height:100%;object-fit:cover">`:`✦<br>${esc(b.title)}`}</div><div class="book-info"><b>${esc(b.title)}</b><small>${esc(b.author_name)} · ${esc(b.genre)}</small></div></article>`).join(""):'<div class="notice">Chưa tìm thấy truyện phù hợp.</div>'}
async function getChapters(id){if(sb&&!String(id).startsWith("d")){let {data}=await sb.from("chapters").select("*").eq("book_id",id).eq("published",true).order("chapter_no");return data||[]}return localChapters[id]||[]}
async function openBook(id){await fetchBooks();currentBook=books.find(b=>b.id===id)||localBooks.find(b=>b.id===id);if(!currentBook)return;let ch=await getChapters(id);document.getElementById("detailView").innerHTML=`<div class="panel"><button class="ghost" onclick="home()">← Quay lại</button><div class="row" style="align-items:flex-start;margin-top:18px"><div class="cover" style="width:145px;min-width:145px;height:190px;border-radius:12px">${esc(currentBook.title)}</div><div><h1 style="font: bold 30px Georgia;margin:0">${esc(currentBook.title)}</h1><p class="muted">${esc(currentBook.author_name)} · ${esc(currentBook.genre)} · ${esc(currentBook.status||"Đang ra")}</p><p>${esc(currentBook.description)}</p><button onclick="bookmark('${id}')">♡ Lưu vào tủ sách</button></div></div></div><div class="section-head"><h2>Danh sách chương</h2><span class="muted">${ch.length} chương</span></div><div class="panel">${ch.length?ch.map(c=>`<div class="listitem"><button class="ghost" style="width:100%;text-align:left" onclick="readChapter('${id}','${c.id}')">Chương ${c.chapter_no}: ${esc(c.title)}</button></div>`).join(""):'<p class="muted">Truyện mẫu chưa có nội dung chương. Tác giả có thể đăng chương trong khu vực quản lý.</p>'}</div>`;show("detailView")}
function bookmark(id){let s=JSON.parse(localStorage.getItem("mtc_shelf")||"[]");if(!s.includes(id))s.push(id);localStorage.setItem("mtc_shelf",JSON.stringify(s));toast("Đã lưu vào tủ sách")}
async function openShelf(){let ids=JSON.parse(localStorage.getItem("mtc_shelf")||"[]");await fetchBooks();let arr=books.filter(b=>ids.includes(b.id));document.getElementById("shelfView").innerHTML=`<h1>Tủ sách của tôi</h1><div class="grid">${arr.map(b=>`<article class="book" onclick="openBook('${b.id}')"><div class="cover">${esc(b.title)}</div><div class="book-info"><b>${esc(b.title)}</b><small>${esc(b.author_name)}</small></div></article>`).join("")||'<p class="muted">Bạn chưa lưu truyện nào.</p>'}</div>`;show("shelfView")}
async function readChapter(bid,cid){let ch=await getChapters(bid);currentChapter=ch.find(c=>c.id===cid);if(!currentChapter)return;let idx=ch.indexOf(currentChapter);document.getElementById("readerView").innerHTML=`<div class="reader"><button class="ghost" onclick="openBook('${bid}')">← Danh sách chương</button><p class="muted">${esc(currentBook?.title||"")}</p><h1 style="font:30px Georgia">Chương ${currentChapter.chapter_no}: ${esc(currentChapter.title)}</h1><div class="reader-controls"><button class="ghost" onclick="changeSize(-1)">A−</button><button class="ghost" onclick="changeSize(1)">A+</button><select onchange="setTheme(this.value)"><option value="light">Sáng</option><option value="dark">Tối</option><option value="paper">Giấy</option><option value="rose">Hồng</option></select></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="reader-text" id="readerText">${esc(currentChapter.content)}</div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="row between"><button class="ghost" ${idx===0?"disabled":""} onclick="readChapter('${bid}','${ch[idx-1]?.id}')">Chương trước</button><button ${idx===ch.length-1?"disabled":""} onclick="readChapter('${bid}','${ch[idx+1]?.id}')">Chương tiếp</button></div></div>`;show("readerView");document.querySelector(".reader-controls select").value=document.documentElement.dataset.theme||"light";document.getElementById("readerText").style.fontSize=readerSize+"px";localStorage.setItem("mtc_last",JSON.stringify({bid,cid}))}
function changeSize(n){readerSize=Math.max(15,Math.min(30,readerSize+n));document.getElementById("readerText").style.fontSize=readerSize+"px"}
function openAccount(){if(!sb){accountModal();return}if(!user){accountModal();return}dashboard()}
function accountModal(){if(!sb){document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>Tài khoản</h2><button class="ghost" onclick="closeModal()">✕</button></div><div class="notice">Bản xem trước đang chạy ở chế độ cục bộ. Kết nối Supabase theo README để bật đăng nhập và phân quyền trực tuyến.</div><div class="field-wrap"><label>Giao diện</label><select class="field" onchange="setTheme(this.value)"><option value="light">Trắng – tím</option><option value="dark">Đen – tím</option><option value="paper">Giấy cổ điển</option><option value="rose">Hồng pastel</option></select></div><button class="ghost" onclick="closeModal()">Đóng</button></div></div>`;return}document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>Đăng nhập / Đăng ký</h2><button class="ghost" onclick="closeModal()">✕</button></div><div class="field-wrap"><label>Tên hiển thị (chỉ cần khi đăng ký)</label><input id="authName" class="field" placeholder="Tên của bạn"></div><div class="field-wrap"><label>Email</label><input id="authEmail" type="email" class="field" placeholder="email@example.com"></div><div class="field-wrap"><label>Mật khẩu</label><input id="authPass" type="password" class="field" placeholder="Ít nhất 6 ký tự"></div><div class="row"><button onclick="signIn()">Đăng nhập</button><button class="ghost" onclick="signUp()">Tạo tài khoản</button></div><p class="muted small">Tài khoản mới mặc định là độc giả. Quản trị viên có thể cấp quyền tác giả.</p></div></div>`}
async function signIn(){let email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPass").value;if(!email||!password)return toast("Nhập email và mật khẩu");let {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(error.message);closeModal();toast("Đăng nhập thành công");dashboard()}
async function signUp(){let email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPass").value,name=document.getElementById("authName").value.trim()||"Độc giả";if(!email||password.length<6)return toast("Nhập email và mật khẩu từ 6 ký tự");let {error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)return toast(error.message);closeModal();toast("Đã tạo tài khoản. Kiểm tra email nếu cần xác nhận.")}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
async function dashboard(){let role=profile?.role||"reader";document.getElementById("dashboardView").innerHTML=`<div class="section-head"><h1>Khu vực quản lý</h1><button class="ghost" onclick="sb.auth.signOut()">Đăng xuất</button></div><div class="panel"><p>Xin chào, <b>${esc(profile?.display_name||user.email)}</b></p><p class="muted">Vai trò: ${esc(role)}</p>${role==="admin"||role==="author"?`<button onclick="bookForm()">＋ Tạo truyện mới</button>`:"<p>Hiện tài khoản chưa có quyền tác giả. Hãy liên hệ quản trị viên để được cấp quyền.</p>"}</div>${role==="admin"?'<div class="panel"><h2>Quản lý tác giả</h2><p class="muted">Tìm người dùng theo email trong Supabase Auth, sau đó cấp role author bằng trang quản trị Supabase.</p></div>':""}<div id="myBooks"></div>`;show("dashboardView");if(role==="author"||role==="admin"){let {data}=await sb.from("books").select("*").eq("author_id",user.id);document.getElementById("myBooks").innerHTML=(data||[]).map(b=>`<div class="panel"><b>${esc(b.title)}</b> · ${b.published?"Đã xuất bản":"Bản nháp"} <button class="ghost" onclick="chapterForm('${b.id}')">Thêm chương</button></div>`).join("")}}
function bookForm(){document.getElementById("modalRoot").innerHTML=`<div class="modalback"><div class="modal"><h2>Tạo truyện</h2><div class="field-wrap"><label>Tên truyện</label><input id="bt" class="field"></div><div class="field-wrap"><label>Thể loại</label><select id="bg" class="field">${genres.slice(1).map(x=>`<option>${x}</option>`)}</select></div><div class="field-wrap"><label>Giới thiệu</label><textarea id="bd" class="field"></textarea></div><div class="row"><button onclick="saveBook()">Lưu bản nháp</button><button class="ghost" onclick="closeModal()">Hủy</button></div></div></div>`}
async function saveBook(){let row={title:document.getElementById("bt").value.trim(),genre:document.getElementById("bg").value,description:document.getElementById("bd").value,author_id:user.id,published:false};if(!row.title)return toast("Nhập tên truyện");let {error}=await sb.from("books").insert(row);if(error)return toast(error.message);closeModal();toast("Đã tạo truyện");dashboard()}
function chapterForm(id){document.getElementById("modalRoot").innerHTML=`<div class="modalback"><div class="modal"><h2>Thêm chương</h2><div class="field-wrap"><label>Số chương</label><input id="cn" type="number" class="field" value="1"></div><div class="field-wrap"><label>Tiêu đề chương</label><input id="ct" class="field"></div><div class="field-wrap"><label>Nội dung</label><textarea id="cc" class="field" style="min-height:220px"></textarea></div><button onclick="saveChapter('${id}')">Lưu chương</button> <button class="ghost" onclick="closeModal()">Hủy</button></div></div>`}
async function saveChapter(id){let row={book_id:id,chapter_no:+document.getElementById("cn").value,title:document.getElementById("ct").value,content:document.getElementById("cc").value,published:false};let {error}=await sb.from("chapters").insert(row);if(error)return toast(error.message);closeModal();toast("Đã lưu chương nháp");dashboard()}
init();
</script>
</body></html>
